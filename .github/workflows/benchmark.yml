name: benchmark

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Install Neon CLI
        run: npm install -g neon@latest
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run benchmark
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_AI_GATEWAY_BASE_URL: ${{ secrets.NEON_AI_GATEWAY_BASE_URL }}
          NEON_AI_GATEWAY_TOKEN: ${{ secrets.NEON_AI_GATEWAY_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: tokenomics-benchmark-results
          path: |
            src/data/latest-benchmark.json
            benchmark/results/latest.json
